name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            grep -n "admin-sidebar .collapse.show" public/css/admin.css || true
            stat public/css/admin.css
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            php artisan reverb:restart
            if [ -d "../public_html/css" ]; then cp -f public/css/admin.css public/css/admin-grid.css ../public_html/css/; fi
            if [ -d "/var/www/html/css" ]; then cp -f public/css/admin.css public/css/admin-grid.css /var/www/html/css/; fi

