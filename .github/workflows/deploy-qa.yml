name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            grep -n "admin-sidebar .collapse.show" public/css/admin.css || true
            stat public/css/admin.css
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            php artisan reverb:restart
            echo "=== AUDIT PHASE 2: DEV SERVER CONFIG & ROOT ==="
            pwd
            whoami
            php -r "echo 'Base path: ' . base_path() . PHP_EOL;"
            echo "--- NGINX / APACHE VHOST CHECK ---"
            nginx -T 2>/dev/null | grep -n -A15 -B5 "dev.peersunity.com" || apache2ctl -S 2>/dev/null || httpd -S 2>/dev/null || true
            echo "--- DIRECTORY LISTINGS ---"
            ls -la /home/devunity || true
            ls -la /home/devunity/laravel || true
            ls -la /home/devunity/laravel/public || true
            ls -la ../public_html 2>/dev/null || true
            ls -la /var/www/html 2>/dev/null || true

            echo "=== AUDIT PHASE 3: VERIFY FILE STORAGE & ADS IN DB ==="
            php artisan tinker --execute="App\Models\Ad::query()->select('id','title','image_path')->get()->each(fn (\$ad) => dump(['id' => \$ad->id, 'title' => \$ad->title, 'image_path' => \$ad->image_path, 'image_url' => \$ad->image_url]));" || true
            find storage/app/public/ads -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true

