name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            php artisan migrate --force

            TARGET="$(readlink -f storage/app/public)"
            LINK="public/storage"

            mkdir -p storage/app/public/ads

            if [ -L "$LINK" ]; then
                CURRENT="$(readlink -f "$LINK" || true)"
                if [ "$CURRENT" != "$TARGET" ]; then
                    rm "$LINK"
                    ln -s "$TARGET" "$LINK"
                fi
            elif [ -d "$LINK" ]; then
                echo "Notice: $LINK is a real directory. Migrating files to $TARGET and creating backup."
                cp -a public/storage/. storage/app/public/
                BACKUP="public/storage_backup_$(date +%Y%m%d_%H%M%S)"
                mv public/storage "$BACKUP"
                echo "Backed up real directory to $BACKUP"
                ln -s "$TARGET" "$LINK"
            else
                ln -s "$TARGET" "$LINK"
            fi

            FINAL="$(readlink -f "$LINK" || true)"

            if [ "$FINAL" != "$TARGET" ]; then
                echo "ERROR: storage symlink verification failed"
                echo "Expected: $TARGET"
                echo "Actual:   $FINAL"
                exit 1
            fi

            mkdir -p storage/app/public/ads
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p bootstrap/cache

            chmod -R ug+rwX,o+rX storage/app/public
            chmod -R ug+rwX storage/framework bootstrap/cache

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            php artisan reverb:restart

            FILE="ads/fTRrFc8ao6by6RvQ52BI8TRshddT8vXedezKceTJ.png"

            echo "=== Laravel storage file ==="
            test -f "storage/app/public/$FILE" && echo "storage file: EXISTS" || echo "storage file: MISSING"
            ls -l "storage/app/public/$FILE" || true
            file "storage/app/public/$FILE" || true

            echo "=== Public symlink file ==="
            test -f "public/storage/$FILE" && echo "public file: EXISTS" || echo "public file: MISSING"
            ls -l "public/storage/$FILE" || true
            file "public/storage/$FILE" || true

            echo "=== Symlink state ==="
            ls -ld public/storage || true
            readlink public/storage || true
            readlink -f public/storage || true
            readlink -f storage/app/public || true

            echo "=== Exact URL ==="
            curl -sS -D /tmp/ad.headers -o /tmp/ad.body "https://dev.peersunity.com/storage/ads/fTRrFc8ao6by6RvQ52BI8TRshddT8vXedezKceTJ.png" || true
            cat /tmp/ad.headers || true
            file /tmp/ad.body || true
            wc -c /tmp/ad.body || true
