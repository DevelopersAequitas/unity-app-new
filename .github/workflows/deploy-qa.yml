name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction

            mkdir -p storage/app/public/ads
            TARGET="$(cd storage/app/public && pwd -P)"
            LINK="public/storage"

            mkdir -p "$(dirname "$LINK")"

            if [ -L "$LINK" ]; then
                CURRENT="$(readlink -f "$LINK" || true)"
                if [ "$CURRENT" != "$TARGET" ]; then
                    rm -f "$LINK"
                    ln -sfn "$TARGET" "$LINK"
                fi
            elif [ -e "$LINK" ]; then
                BACKUP="public/storage_backup_$(date +%Y%m%d_%H%M%S)"
                echo "Notice: $LINK exists and is not a symlink. Backing up to $BACKUP"
                mv "$LINK" "$BACKUP"
                ln -sfn "$TARGET" "$LINK"
            else
                ln -sfn "$TARGET" "$LINK"
            fi

            FINAL="$(readlink -f "$LINK" || true)"
            echo "TARGET=$TARGET"
            echo "LINK=$LINK"
            echo "FINAL=$FINAL"

            if [ "$FINAL" != "$TARGET" ]; then
                echo "ERROR: storage symlink verification failed"
                echo "Expected: $TARGET"
                echo "Actual:   $FINAL"
                echo "Public directory contents:"
                ls -la public || true
                exit 1
            fi

            mkdir -p storage/app/public/ads
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p bootstrap/cache

            chmod -R ug+rwX,o+rX storage/app/public || true
            chmod -R ug+rwX storage/app storage/framework bootstrap/cache || true

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            php artisan reverb:restart > /dev/null 2>&1 || true
            if [ -d "../public_html" ] && [ -w "../public_html" ]; then
                mkdir -p ../public_html/images ../public_html/fonts ../public_html/css
                cp -rf public/css/admin.css public/css/admin-grid.css ../public_html/css/ 2>/dev/null || true
                cp -rf public/images/* ../public_html/images/ 2>/dev/null || true
                cp -rf public/fonts/* ../public_html/fonts/ 2>/dev/null || true
            fi
            if [ -d "/var/www/html" ] && [ -w "/var/www/html" ]; then
                mkdir -p /var/www/html/images /var/www/html/fonts /var/www/html/css
                cp -rf public/css/admin.css public/css/admin-grid.css /var/www/html/css/ 2>/dev/null || true
                cp -rf public/images/* /var/www/html/images/ 2>/dev/null || true
                cp -rf public/fonts/* /var/www/html/fonts/ 2>/dev/null || true
            fi
            php artisan storage:link --force || true
            if [ -d "../public_html" ] && [ -w "../public_html" ]; then ln -sfn ${{ secrets.QA_DEPLOY_PATH }}/storage/app/public ../public_html/storage || true; fi
            if [ -d "/var/www/html" ] && [ -w "/var/www/html" ]; then ln -sfn ${{ secrets.QA_DEPLOY_PATH }}/storage/app/public /var/www/html/storage || true; fi
