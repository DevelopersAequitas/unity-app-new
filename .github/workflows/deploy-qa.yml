name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction

            mkdir -p storage/app/public/ads storage/app/public/uploads
            TARGET="$(cd storage/app/public && pwd -P)"
            LINK="public/storage"

            mkdir -p "$(dirname "$LINK")"

            if [ -L "$LINK" ]; then
                CURRENT="$(readlink -f "$LINK" || true)"
                if [ "$CURRENT" != "$TARGET" ]; then
                    rm -f "$LINK"
                    ln -sfn "$TARGET" "$LINK"
                fi
            elif [ -e "$LINK" ]; then
                BACKUP="public/storage_backup_$(date +%Y%m%d_%H%M%S)"
                echo "Notice: $LINK exists and is not a symlink. Backing up to $BACKUP"
                mv "$LINK" "$BACKUP"
                ln -sfn "$TARGET" "$LINK"
            else
                ln -sfn "$TARGET" "$LINK"
            fi

            FINAL="$(readlink -f "$LINK" || true)"
            echo "TARGET=$TARGET"
            echo "LINK=$LINK"
            echo "FINAL=$FINAL"

            if [ "$FINAL" != "$TARGET" ]; then
                echo "ERROR: storage symlink verification failed"
                echo "Expected: $TARGET"
                echo "Actual:   $FINAL"
                echo "Public directory contents:"
                ls -la public || true
                exit 1
            fi

            mkdir -p storage/app/public/ads
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p bootstrap/cache

            chmod -R ug+rwX,o+rX storage/app/public || true
            chmod -R ug+rwX storage/app storage/framework bootstrap/cache || true

            php artisan migrate --force || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            php artisan reverb:restart > /dev/null 2>&1 || true
            if [ -d "../public_html" ] && [ -w "../public_html" ]; then
                mkdir -p ../public_html/images ../public_html/fonts ../public_html/css ../public_html/js ../public_html/build
                cp -rf public/css/admin.css public/css/admin-grid.css ../public_html/css/ 2>/dev/null || true
                cp -rf public/js/* ../public_html/js/ 2>/dev/null || true
                cp -rf public/images/* ../public_html/images/ 2>/dev/null || true
                cp -rf public/fonts/* ../public_html/fonts/ 2>/dev/null || true
                cp -rf public/build/* ../public_html/build/ 2>/dev/null || true
            fi
            if [ -d "/var/www/html" ] && [ -w "/var/www/html" ]; then
                mkdir -p /var/www/html/images /var/www/html/fonts /var/www/html/css /var/www/html/js /var/www/html/build
                cp -rf public/css/admin.css public/css/admin-grid.css /var/www/html/css/ 2>/dev/null || true
                cp -rf public/js/* /var/www/html/js/ 2>/dev/null || true
                cp -rf public/images/* /var/www/html/images/ 2>/dev/null || true
                cp -rf public/fonts/* /var/www/html/fonts/ 2>/dev/null || true
                cp -rf public/build/* /var/www/html/build/ 2>/dev/null || true
            fi
            php artisan storage:link --force || true
            if [ -d "../public_html" ] && [ -w "../public_html" ]; then ln -sfn ${{ secrets.QA_DEPLOY_PATH }}/storage/app/public ../public_html/storage || true; fi
            if [ -d "/var/www/html" ] && [ -w "/var/www/html" ]; then ln -sfn ${{ secrets.QA_DEPLOY_PATH }}/storage/app/public /var/www/html/storage || true; fi

  deploy-devunity-peersglobal:
    name: Deploy to devunity.peersglobal.com via SSH
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.UNITY_PG_DEV_SSH_USER || 'devpgunity' }}
          key: ${{ secrets.UNITY_PG_DEV_SSH_KEY || secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            DEPLOY_PATH="${{ secrets.UNITY_PG_DEV_DEPLOY_PATH || '/home/devpgunity/laravel' }}"
            SHARED_MEDIA="/home/devunity/laravel/storage/app/public"
            case "$DEPLOY_PATH" in /home/*/laravel) ;; *) echo "ERROR: unexpected deploy path $DEPLOY_PATH"; exit 1 ;; esac
            cd "$DEPLOY_PATH"
            pwd
            whoami
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            COMPOSER_BIN="$(command -v composer || echo /usr/local/bin/composer)"
            "$COMPOSER_BIN" install                 --no-dev                 --prefer-dist                 --optimize-autoloader                 --no-interaction

            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R ug+rwX storage/framework storage/logs bootstrap/cache || true

            # Media is shared with the existing domain (same database): link each media folder, never copy or delete.
            # Note: script_stop checks every line's exit code, so each line below must exit 0.
            if [ -d "$SHARED_MEDIA" ]; then
                for SRC in "$SHARED_MEDIA"/*/; do
                    NAME="$(basename "$SRC")"
                    if [ "$NAME" != "public" ] && [ ! -L "$SHARED_MEDIA/$NAME" ] && [ ! -e "storage/app/public/$NAME" ] && [ ! -L "storage/app/public/$NAME" ]; then ln -s "$SHARED_MEDIA/$NAME" "storage/app/public/$NAME"; fi
                done
            fi
            if [ ! -e public/storage ] && [ ! -L public/storage ]; then ln -s "$DEPLOY_PATH/storage/app/public" public/storage; fi

            # No migrations: the database is shared with the existing domain and managed manually.
            # No cache:clear / optimize:clear: the database cache store is shared with the existing domain.
            # No queue:restart / reverb:restart: workers and Reverb are shared and restarted by the existing job.
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            if [ -d "../public_html" ] && [ -w "../public_html" ] && [ ! -L "../public_html" ]; then
                mkdir -p ../public_html/images ../public_html/fonts ../public_html/css ../public_html/js ../public_html/build
                cp -rf public/css/admin.css public/css/admin-grid.css ../public_html/css/ 2>/dev/null || true
                cp -rf public/js/* ../public_html/js/ 2>/dev/null || true
                cp -rf public/images/* ../public_html/images/ 2>/dev/null || true
                cp -rf public/fonts/* ../public_html/fonts/ 2>/dev/null || true
                cp -rf public/build/* ../public_html/build/ 2>/dev/null || true
            fi
            echo "Deployed $(git rev-parse --short HEAD) to $DEPLOY_PATH"
