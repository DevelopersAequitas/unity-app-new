name: Deploy to QA Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QA Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.QA_DEPLOY_PATH }}
            pwd
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git rev-parse HEAD
            git status --short
            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --no-interaction
            php artisan migrate --force

            TARGET="$(readlink -f storage/app/public)"
            LINK="public/storage"

            mkdir -p storage/app/public/ads

            if [ -L "$LINK" ]; then
                CURRENT="$(readlink -f "$LINK" || true)"
                if [ "$CURRENT" != "$TARGET" ]; then
                    rm "$LINK"
                    ln -s "$TARGET" "$LINK"
                fi
            elif [ -e "$LINK" ]; then
                echo "ERROR: $LINK exists but is not a symbolic link"
                ls -ld "$LINK"
                exit 1
            else
                ln -s "$TARGET" "$LINK"
            fi

            FINAL="$(readlink -f "$LINK" || true)"

            if [ "$FINAL" != "$TARGET" ]; then
                echo "ERROR: storage symlink verification failed"
                echo "Expected: $TARGET"
                echo "Actual:   $FINAL"
                exit 1
            fi

            echo "Storage symlink verified:"
            ls -ld "$LINK"
            readlink -f "$LINK"

            chmod -R ug+rwX storage bootstrap/cache
            stat -c '%U:%G %a %n' storage storage/app/public storage/app/public/ads bootstrap/cache

            echo "=== TEST2 AD RECORD & FILE CHECK ==="
            php artisan tinker --execute="\$ad = App\Models\Ad::where('title', 'test2')->latest()->first(); dump(\$ad?->only(['id','title','image_path'])); dump(['image_url' => \$ad?->image_url]);" || true
            find storage/app/public/ads -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            php artisan reverb:restart
